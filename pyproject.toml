[tool.ruff]
line-length = 100
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "results",
    "data",
    "scripts/smoke",
]

[tool.ruff.lint]
# Two tiers, because the codebase carries a large cosmetic backlog that is
# not worth blocking a merge over, while the defect classes below must never
# regress again (several of these were live NameError crashes).
#
# Blocking — correctness defects:
#   F821 undefined name      (crashes at runtime)
#   F601/F602 duplicate key   (silently drops data)
#   F811 redefinition         (silently shadows an import/definition)
#   B023 loop-var late bind   (closure captures the wrong value)
#   B025 duplicate except     (unreachable handler)
#   E712/E711 truth comparison (wrong boolean logic)
#   E722 bare except          (swallows KeyboardInterrupt/SystemExit)
# Advisory — style/formatting, reported as warnings only:
#   W29x whitespace, I001 import order, F841 unused local, F541 f-string,
#   B007 unused loop var, E702/E741/E401/E401 minor style.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
]
ignore = [
    "E501",  # line-too-long — historical codebase, leave alone
    "B008",  # calls to getattr/hasattr in argument defaults — common in configs
    "E402",  # module-level import not at top — common after sys.path inserts
    "B904",  # raise from without `from e` — legacy pattern
    "UP006", # typing.List vs list — historical code uses typing
    "UP007", # typing.X vs X — historical code uses typing
    "F401",  # imported but unused — many intentional re-exports
    # Advisory backlog: fixed in bulk later, non-blocking until then.
    "W291", "W293", "W292",  # trailing / no-newline whitespace
    "I001",                 # import block unsorted
    "F841",                 # unused local variable
    "F541",                 # f-string without placeholders
    "B007",                 # unused loop control variable
    "E401", "E702", "E741", # minor style
    "W605",                 # invalid escape sequence in string literal
    "B005", "B009",         # misleading strip()/getattr-with-constant
    "E712",                 # `== True` on Polars expressions is correct, not a bug
    "UP015", "UP034", "UP037",  # pyupgrade modernisation — cosmetic
]

[tool.ruff.lint.per-file-ignores]
# assert False is the pytest idiom.
"tests/*" = ["B011", "F811"]
"scripts/*" = ["E402", "E722"]  # shell scripts + lenient imports
"results/**" = ["E402", "F401", "F841"]
