[pytest]
# Per-test timeout. The pytest-timeout package would be ideal but we
# can't assume it's installed; the manual guard in conftest.py handles
# the warning path. If pytest-timeout is installed, this is overridden.
addopts =
    -ra
    --strict-markers
    --tb=short
    --durations=10
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    fast: pure-Python unit test, no LLM / no network (<5 s)
    slow: requires >5 s but still no external network
    network: hits external API (Cloudflare / RIS / LLM) — skip in CI by default
    timeout(N): per-test timeout override in seconds
filterwarnings =
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:elasticsearch
    ignore::DeprecationWarning:pyscipopt
